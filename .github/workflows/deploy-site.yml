name: Deploy site to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit SHA (or ref) to build. A reusable workflow inherits the
          caller's original event context, so callers that create a new commit
          must pass it explicitly; otherwise the pre-sync tree is deployed.
        required: false
        type: string

# Least privilege by default; only the deploy job escalates.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.head_ref || 'deploy' }}
  cancel-in-progress: ${{ github.head_ref != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # `inputs` is empty for push/pull_request, so those builds keep the
          # current event SHA; workflow_call callers pin a newer commit.
          ref: ${{ inputs.ref || github.sha }}
          # Full history + tags are required to decide whether the release tag
          # named by the lock file already contains this commit.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install site dependencies
        run: npm ci
        working-directory: site

      # Publication is a property of the git history, not of the tree: the site
      # may only advertise `npx skills add …#v<release>` once `v<release>` is a
      # real tag that CONTAINS the commit being built. Resolving it here keeps
      # the site free of any runtime network access.
      - name: Resolve release publication state
        id: release
        run: |
          RELEASE=$(node -p "JSON.parse(require('fs').readFileSync('catalog/skills.lock.json','utf8')).release")
          TAG="v$RELEASE"
          PUBLISHED=false
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1 \
            && git merge-base --is-ancestor "refs/tags/$TAG" HEAD; then
            PUBLISHED=true
          fi
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "Release $TAG published=$PUBLISHED"

      # The sync workflow deploys through this workflow after a GITHUB_TOKEN
      # push, which never triggers the normal validate run. Without this step a
      # synced commit could deploy without any site test having executed.
      - name: Run site unit tests
        run: npm test
        working-directory: site
        env:
          RELEASE_PUBLISHED: ${{ steps.release.outputs.published }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: false

      - name: Build site (Astro + Pagefind)
        run: npm run build
        working-directory: site
        env:
          RELEASE_PUBLISHED: ${{ steps.release.outputs.published }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
