orphans:
  - path: skills/dotnet/csharp-mcp-server-generator
    note: No verified upstream source repository is currently documented for this skill.
  - path: skills/github/create-github-pull-request-from-specification
    note: No verified upstream source repository is currently documented for this skill.
  - path: skills/vscode/code-review
    note: Candidate upstream is https://github.com/awesome-skills/code-review-skill, but this mirror is intentionally tracked as an orphan until reviewed.

local:
  - root: skills/lettucebo
    note: Reserved for future local/original skills. Registry coverage counts only existing SKILL.md files, and sync must never write this root.

overrides:
  - path: skills/cloudflare/building-ai-agent-on-cloudflare
    transform: command-to-skill
    source: commands/build-agent.md
    note: Mirrors an upstream command document into the local skill registry as a curated skill folder.
  - path: skills/cloudflare/building-mcp-server-on-cloudflare
    transform: command-to-skill
    source: commands/build-mcp.md
    note: Mirrors an upstream command document into the local skill registry as a curated skill folder.
  - path: skills/cloudflare/sandbox-sdk
    transform: rename-local-skill
    source: skills/sandbox-stable
    note: Keeps the current local folder name while tracking the upstream stable Sandbox skill path.
